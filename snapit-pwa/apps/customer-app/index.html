<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#FFFFFF" />
    <meta name="description" content="Fastest 10-minute grocery and food delivery in KGF. Order delicious meals, fresh groceries, snacks, and daily essentials delivered to your door." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Minnit" />
    <title>Minnit • Fast Delivery KGF</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Eagerly Preload Mascot Popup Images for 0ms Popups -->
    <link rel="preload" as="image" href="/baby/iteam_added_toast.jpg" />
    <link rel="preload" as="image" href="/baby/iteam_added.jpg" />
    <link rel="preload" as="image" href="/baby/more_item_added.jpg" />
    <link rel="preload" as="image" href="/baby/saved_favoraoite_toast.jpg" />
    <link rel="preload" as="image" href="/baby/boy_item_added.jpg" />
    <link rel="preload" as="image" href="/baby/cart_with_item.jpg" />
    <link rel="preload" as="image" href="/baby/cart_empty.jpg" />
  </head>
  <body style="background-color: #FFFFFF;">
    <div id="root">
      <!-- Instant First-Paint Splash to eliminate blank delay -->
      <div style="position:fixed;inset:0;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:sans-serif;">
        <img src="/images/minnit_cart_nd_name.png" alt="Minnit" style="height:46px;width:auto;object-fit:contain;margin-bottom:16px;" />
        <div style="width:26px;height:26px;border:3px solid #e2e8f0;border-top-color:#059669;border-radius:50%;animation:minnitSpin 0.7s linear infinite;"></div>
      </div>
      <style>@keyframes minnitSpin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
