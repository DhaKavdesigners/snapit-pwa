<!doctype html>
<html lang="en" class="h-full bg-slate-50 text-slate-900">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Minnit Operations Command Center • KGF Admin</title>
    
    <!-- PWA & SEO Meta Tags -->
    <meta name="description" content="Hyperlocal operations command center for Minnit: Live fleet tracking, instant rider KYC approvals, store catalogs, and dispatch control in KGF." />
    <meta name="theme-color" content="#020617" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#020617" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Minnit Admin" />
    <meta name="application-name" content="Minnit Admin" />

    <!-- Icons & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/jpeg" href="/minnit_logo.jpg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="h-full font-sans antialiased selection:bg-emerald-500 selection:text-white bg-slate-50 text-slate-900 overflow-x-hidden">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatically register service worker on window load for PWABuilder / PWA installability
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            console.log('[PWA] ServiceWorker registered with scope:', reg.scope);
          }).catch(function(err) {
            console.error('[PWA] ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
